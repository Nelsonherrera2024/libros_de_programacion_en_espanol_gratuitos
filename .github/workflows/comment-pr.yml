name: Comment on the pull request

on:
  workflow_run:
    workflows: ["free-programming-books-lint"]
    types:
      - completed

jobs:
  upload:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: 'Resolve the pull request'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Resolve the pull request from the triggering run's head repository and
          # branch. Both values come from the event, so the artifact that a
          # contributor to the pull request can edit cannot redirect this
          # write-token job to another pull request.
          number=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=all \
            -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: 'Download artifact'
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "pr"
            })[0];
            let download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/pr.zip`, Buffer.from(download.data));

      - name: 'Unzip artifact'
        if: steps.pr.outputs.number != ''
        run: unzip pr.zip

      - name: 'Comment on PR'
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # The artifact is produced by a run whose workflow an external
          # contributor can change. Treat its files as data: never interpolate
          # them into a command line, and never follow a symlink that a crafted
          # archive may contain.
          if [ -f error.log ] && [ ! -L error.log ] && [ -s error.log ]; then
            {
              echo 'Linter failed, fix the error(s):'
              echo '```'
              cat error.log
              echo '```'
            } > comment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "linter error"
          else
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "linter error"
          fi
